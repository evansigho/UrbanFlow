name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pages:
    types: [published]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install
        working-directory: ./urbanflow---the-city-super-app

      - name: Build Project
        run: npm run build
        working-directory: ./urbanflow---the-city-super-app

      - name: Copy 404.html to dist
        run: cp ./urbanflow---the-city-super-app/public/404.html ./urbanflow---the-city-super-app/dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: ./urbanflow---the-city-super-app/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
